<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🗣️ Text to Speech Reader</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background: #0f172a; color: #fff; padding: 15px; display: flex; justify-content: center; }
        .card { width: 100%; max-width: 450px; background: #1e293b; padding: 20px; border-radius: 12px; }
        h2 { color: #4ade80; font-size: 18px; margin-bottom: 12px; text-align: center; }
        textarea { width: 100%; height: 120px; background: #0f172a; border: 1px solid #334155; color: #4ade80; padding: 10px; border-radius: 8px; font-size: 14px; outline: none; margin-bottom: 10px; resize: none; }
        .controls { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; font-size: 12px; color: #94a3b8; }
        input[type="range"] { width: 100%; accent-color: #4ade80; }
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 10px; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .play { background: #4ade80; color: #000; }
        .stop { background: #f87171; color: #000; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🗣️ Voice Speech Reader</h2>
        <textarea id="textInput" placeholder="यहाँ टेक्स्ट लिखें, यह उसे बोलकर सुनाएगा..."></textarea>
        
        <div class="controls">
            <label>स्पीड (Speed): <input type="range" id="rate" min="0.5" max="2" value="1" step="0.1"></label>
            <label>आवाज का भारीपन (Pitch): <input type="range" id="pitch" min="0.5" max="2" value="1" step="0.1"></label>
        </div>

        <div class="btn-group">
            <button class="play" onclick="speakText()">▶ बोलें</button>
            <button class="stop" onclick="stopSpeech()">⏹ रोकें</button>
        </div>
    </div>

    <script>
        const synth = window.speechSynthesis;

        function speakText() {
            if (synth.speaking) synth.cancel();
            const text = document.getElementById('textInput').value;
            if(!text) return;

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = document.getElementById('rate').value;
            utterance.pitch = document.getElementById('pitch').value;
            synth.speak(utterance);
        }

        function stopSpeech() {
            if (synth.speaking) synth.cancel();
        }
    </script>
</body>
</html>
