i<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ महासंग्रह Smart AI Lab</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #030308; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* 🏷️ शीर्ष नेविगेशन */
        header {
            background: rgba(10, 10, 25, 0.9);
            border-bottom: 1px solid rgba(0, 255, 204, 0.2);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 18px;
            background: linear-gradient(90deg, #00ffcc, #ff007f, #ffaa00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            font-weight: 900;
        }

        .api-input {
            background: #0a0a16;
            border: 1px solid rgba(0, 255, 204, 0.3);
            color: #00ffcc;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            outline: none;
            width: 220px;
        }

        /* 🖥️ वर्कस्पेस ग्रिड */
        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex: 1;
            gap: 10px;
            padding: 10px;
            height: calc(100vh - 60px);
        }

        /* 📝 एडिटर पैनल */
        .panel {
            background: rgba(15, 15, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 16px;
            font-size: 13px;
            font-weight: bold;
            color: #a0a0c0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #00ffcc;
            padding: 14px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            outline: none;
            resize: none;
            line-height: 1.5;
        }

        /* 👁️ लाइव प्रीव्यू पैनल */
        iframe {
            flex: 1;
            background: #fff;
            border: none;
            border-radius: 0 0 16px 16px;
        }

        /* 🤖 AI कंसोल */
        .ai-chat {
            height: 180px;
            background: #080814;
            border-top: 1px solid rgba(0, 255, 204, 0.2);
            display: flex;
            flex-direction: column;
            padding: 10px;
        }

        .chat-output {
            flex: 1;
            overflow-y: auto;
            font-size: 13px;
            color: #d0d0e0;
            margin-bottom: 8px;
            white-space: pre-wrap;
        }

        .chat-controls {
            display: flex;
            gap: 8px;
        }

        .chat-controls input {
            flex: 1;
            background: #121224;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 14px;
            border-radius: 20px;
            outline: none;
            font-size: 13px;
        }

        .btn {
            background: linear-gradient(135deg, #00ffcc, #0088ff);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }

        .btn:hover { transform: scale(1.05); }

        @media (max-width: 768px) {
            .workspace { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ महासंग्रह Smart AI Lab</h1>
        <input type="password" id="apiKey" class="api-input" placeholder="🔑 Gemini API Key दर्ज करें">
    </header>

    <div class="workspace">
        <!-- बायाँ पैनल: कोड / महासंग्रह संपादक -->
        <div class="panel">
            <div class="panel-header">
                <span>💻 कोड / महासंग्रह टेक्स्ट एडिटर</span>
                <button class="btn" onclick="runCode()">▶ Run Live</button>
            </div>
            <textarea id="codeEditor" placeholder="यहाँ अपना HTML कोड या महासंग्रह का कोई पाठ लिखें..."></textarea>
            
            <!-- AI असिस्टेंट मिनी-कंसोल -->
            <div class="ai-chat">
                <div class="chat-output" id="aiOutput">🤖 AI असिस्टेंट: मुझसे कोड में मदद लें या महासंग्रह के किसी तर्क का विस्तार करवाएं।</div>
                <div class="chat-controls">
                    <input type="text" id="aiPrompt" placeholder="AI से कुछ भी कहें (उदा. 'इस कोड को बेहतर बनाओ')...">
                    <button class="btn" onclick="askAI()">पूछें</button>
                </div>
            </div>
        </div>

        <!-- दायाँ पैनल: लाइव आउटपुट / प्रीव्यू -->
        <div class="panel">
            <div class="panel-header">
                <span>👁️ लाइव प्रीव्यू आउटपुट (Live Output)</span>
            </div>
            <iframe id="preview"></iframe>
        </div>
    </div>

    <script>
        // 1. लाइव कोड रन करना
        function runCode() {
            const code = document.getElementById('codeEditor').value;
            const preview = document.getElementById('preview').contentWindow.document;
            preview.open();
            preview.write(code);
            preview.close();
        }

        // 2. AI से मदद माँगना (Gemini Integration)
        async function askAI() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const prompt = document.getElementById('aiPrompt').value.trim();
            const editorContent = document.getElementById('codeEditor').value;
            const output = document.getElementById('aiOutput');

            if (!apiKey) {
                alert('कृपया पहले ऊपर Gemini API Key डालें!');
                return;
            }
            if (!prompt) return;

            output.innerText = 'सोच रहा हूँ... ⚡';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `तुम एक विशेषज्ञ AI असिस्टेंट हो। एडिटर में वर्तमान कंटेंट यह है:\n\n${editorContent}\n\nयूज़र का सवाल/निर्देश है: ${prompt}`
                            }]
                        }]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    output.innerText = '🤖 AI: ' + data.candidates[0].content.parts[0].text;
                } else {
                    output.innerText = '⚠️ उत्तर प्राप्त नहीं हो सका।';
                }
            } catch (err) {
                output.innerText = '❌ त्रुटि: कनेक्शन में समस्या हुई।';
            }
        }
    </script>
</body>
</html>
