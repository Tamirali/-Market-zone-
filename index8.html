<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Hindi Learning Blackboard</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            font-family: 'Nirmala UI', 'Mangal', 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #ffffff;
        }

        h2 {
            margin-bottom: 5px;
            color: #ffd700;
            text-align: center;
        }

        p.instruction {
            color: #b0bec5;
            font-size: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Traditional Greenish-Black Board Design */
        .blackboard {
            width: 85%;
            max-width: 750px;
            height: 380px;
            background-color: #1b382b; 
            border: 14px solid #5c4033; 
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
        }

        /* Chalk Text Container */
        .chalk-container {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            min-height: 120px;
        }

        /* Individual Clean Chalk Items */
        .chalk-item {
            font-family: 'Mangal', 'Nirmala UI', sans-serif;
            font-size: 70px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.7);
            opacity: 0;
            transform: scale(0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .chalk-item.visible {
            opacity: 1;
            transform: scale(1);
        }

        /* Status & Audio Guide Box */
        .status-box {
            margin-top: 25px;
            font-size: 22px;
            color: #00e676;
            font-weight: bold;
            min-height: 35px;
            text-align: center;
        }

        /* Mic Button */
        .mic-btn {
            margin-top: 20px;
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background 0.3s;
        }

        .mic-btn:hover {
            background-color: #e64a19;
        }

        .mic-btn.listening {
            background-color: #d32f2f;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <h2>बच्चों का शुद्ध हिंदी जादुई ब्लैकबोर्ड</h2>
    <p class="instruction">माइक बटन दबाएं और साफ आवाज में बोलें (जैसे: सोना, कमल, आम, तारा)</p>

    <div class="blackboard">
        <div class="chalk-container" id="chalkContainer">
            <!-- Clean Hindi characters will render here without dotted circles -->
        </div>
    </div>

    <div class="status-box" id="statusText">माइक ऑन करके बोलना शुरू करें...</div>

    <button class="mic-btn" id="micBtn" onclick="toggleListening()">🎤 माइक ऑन करें</button>

    <script>
        const chalkContainer = document.getElementById('chalkContainer');
        const statusText = document.getElementById('statusText');
        const micBtn = document.getElementById('micBtn');

        let recognition;
        let isListening = false;

        // Text-to-Speech function with audio sync
        function speakText(text, callback) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                utterance.rate = 0.75; // Thoda dheere taaki bachche samajh sakein
                if (callback) {
                    utterance.onend = callback;
                }
                window.speechSynthesis.speak(utterance);
            }
        }

        // Web Speech API Initialization
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                isListening = true;
                micBtn.classList.add('listening');
                micBtn.innerText = "🛑 सुन रहा हूँ...";
                statusText.innerText = "ध्यान से सुन रहा हूँ...";
            };

            recognition.onresult = function(event) {
                const spokenText = event.results[0][0].transcript.trim();
                processCleanWord(spokenText);
            };

            recognition.onerror = function(event) {
                statusText.innerText = "आवाज़ स्पष्ट नहीं आई, दोबारा बोलें।";
                stopListeningState();
            };

            recognition.onend = function() {
                stopListeningState();
            };
        } else {
            statusText.innerText = "आपका ब्राउज़र स्पीच रिकग्निशन को सपोर्ट नहीं करता।";
            micBtn.style.display = 'none';
        }

        function toggleListening() {
            if (!recognition) return;
            if (isListening) {
                recognition.stop();
            } else {
                chalkContainer.innerHTML = '';
                recognition.start();
            }
        }

        function stopListeningState() {
            isListening = false;
            micBtn.classList.remove('listening');
            micBtn.innerText = "🎤 माइक ऑन करें";
        }

        // Map dependent matras to independent forms or clean readable sounds to avoid dotted circle (◌)
        const matraCleanMap = {
            'ा': 'आ',
            'ि': 'इ',
            'ী': 'ई',
            'ी': 'ई',
            'ु': 'उ',
            'ू': 'ऊ',
            'ृ': 'ऋ',
            'े': 'ए',
            'ै': 'ऐ',
            'ो': 'ओ',
            'ौ': 'औ',
            'ं': 'अं',
            'ः': 'अः',
            '्': '' // Halant can be skipped for audio/display simplicity
        };

        function processCleanWord(word) {
            statusText.innerHTML = `बोला गया शब्द: <span style="color:#ffd700">${word}</span>`;
            chalkContainer.innerHTML = '';

            let items = [];

            for (let i = 0; i < word.length; i++) {
                let char = word[i];
                let code = char.charCodeAt(0);

                let isMatra = (code >= 0x093E && code <= 0x094C) || (code >= 0x0901 && code <= 0x0903) || (code === 0x094D) || (code === 0x093C);

                if (isMatra) {
                    let soundChar = matraCleanMap[char] || char;
                    // Display clean matra without circle by mapping or using standalone representation if needed, 
                    // but here we render the character cleanly using specific span formatting
                    items.push({ display: char, sound: soundChar, type: 'matra' });
                } else {
                    if (char !== ' ') {
                        items.push({ display: char, sound: char, type: 'akshar' });
                    }
                }
            }

            let index = 0;
            function showNext() {
                if (index < items.length) {
                    let item = items[index];
                    const span = document.createElement('span');
                    span.classList.add('chalk-item');
                    span.innerText = item.display;
                    chalkContainer.appendChild(span);

                    setTimeout(() => {
                        span.classList.add('visible');
                    }, 50);

                    if (item.type === 'matra') {
                        statusText.innerHTML = `मात्रा आई: <strong style="color:#ffeb3b">${item.display}</strong>`;
                    } else {
                        statusText.innerHTML = `अक्षर आया: <strong style="color:#ffeb3b">${item.display}</strong>`;
                    }

                    // Play audio corresponding to the character/matra simultaneously
                    speakText(item.sound, () => {
                        index++;
                        setTimeout(showNext, 400);
                    });
                } else {
                    // Final complete word announcement
                    setTimeout(() => {
                        statusText.innerHTML = `पूरा शब्द बना: <strong style="color:#00e676">${word}</strong>`;
                        speakText(`मिलकर बना, ${word}`);
                    }, 500);
                }
            }

            speakText(`शब्द है`, () => {
                showNext();
            });
        }
    </script>
</body>
</html>
