<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice & Audio Interactive Hindi Blackboard</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            font-family: 'Nirmala UI', 'Mangal', 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #ffffff;
        }

        h2 {
            margin-bottom: 5px;
            color: #ffd700;
            text-align: center;
        }

        p.instruction {
            color: #b0bec5;
            font-size: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Traditional Greenish-Black Board Design */
        .blackboard {
            width: 85%;
            max-width: 750px;
            height: 380px;
            background-color: #1b382b; 
            border: 14px solid #5c4033; 
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
        }

        /* Chalk Text Container */
        .chalk-container {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            min-height: 120px;
        }

        /* Individual Hindi Letters Animation */
        .chalk-letter {
            font-family: 'Mangal', 'Nirmala UI', sans-serif;
            font-size: 65px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.7);
            opacity: 0;
            transform: scale(0.1);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Animation trigger class */
        .chalk-letter.visible {
            opacity: 1;
            transform: scale(1);
        }

        /* Status / Audio Guide Box */
        .status-box {
            margin-top: 25px;
            font-size: 22px;
            color: #00e676;
            font-weight: bold;
            min-height: 35px;
            text-align: center;
        }

        /* Mic Button */
        .mic-btn {
            margin-top: 20px;
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background 0.3s;
        }

        .mic-btn:hover {
            background-color: #e64a19;
        }

        .mic-btn.listening {
            background-color: #d32f2f;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <h2>बच्चों का ऑडियो-विजुअल जादुई ब्लैकबोर्ड</h2>
    <p class="instruction">माइक बटन दबाएं और हिंदी में कोई नाम बोलें (जैसे: कमल, किताब, आम)</p>

    <div class="blackboard">
        <div class="chalk-container" id="chalkContainer">
            <!-- Hindi letters will render here -->
        </div>
    </div>

    <div class="status-box" id="statusText">माइक ऑन करके बोलना शुरू करें...</div>

    <button class="mic-btn" id="micBtn" onclick="toggleListening()">🎤 माइक ऑन करें</button>

    <script>
        const chalkContainer = document.getElementById('chalkContainer');
        const statusText = document.getElementById('statusText');
        const micBtn = document.getElementById('micBtn');

        let recognition;
        let isListening = false;

        // Text-to-Speech function for Hindi Audio
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Purani aawaz rokein taaki overlap na ho
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN'; // Set voice language to Hindi
                utterance.rate = 0.85; // Thoda dheere bolne ke liye taaki bachche samajh sakein
                window.speechSynthesis.speak(utterance);
            }
        }

        // Web Speech API initialization for Hindi (hi-IN)
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN'; 
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                isListening = true;
                micBtn.classList.add('listening');
                micBtn.innerText = "🛑 सुन रहा हूँ...";
                statusText.innerText = "आवाज़ सुनी जा रही है...";
                speakText("सुन रहा हूँ, बोलिए");
            };

            recognition.onresult = function(event) {
                const spokenText = event.results[0][0].transcript.trim();
                processHindiWord(spokenText);
            };

            recognition.onerror = function(event) {
                statusText.innerText = "पहचानने में दिक्कत आई, कृपया दोबारा बोलें।";
                speakText("दोबारा बोलिए");
                stopListeningState();
            };

            recognition.onend = function() {
                stopListeningState();
            };
        } else {
            statusText.innerText = "आपका ब्राउज़र स्पीच रिकग्निशन को सपोर्ट नहीं करता है।";
            micBtn.style.display = 'none';
        }

        function toggleListening() {
            if (!recognition) return;
            if (isListening) {
                recognition.stop();
            } else {
                chalkContainer.innerHTML = ''; 
                recognition.start();
            }
        }

        function stopListeningState() {
            isListening = false;
            micBtn.classList.remove('listening');
            micBtn.innerText = "🎤 माइक ऑन करें";
        }

        // Function to split, animate and speak Hindi letters sequentially
        function processHindiWord(word) {
            statusText.innerHTML = `आपने बोला: <span style="color:#ffd700">${word}</span>`;
            chalkContainer.innerHTML = '';

            const letters = Array.from(word);
            
            // Sabse pehle poora shabd aawaz mein sunayein
            speakText(`आपने बोला, ${word}`);

            letters.forEach((letter, index) => {
                const span = document.createElement('span');
                span.classList.add('chalk-letter');
                span.innerText = letter === ' ' ? ' ' : letter;
                chalkContainer.appendChild(span);

                // Dheere-dheere animation aur audio guide ke sath
                setTimeout(() => {
                    span.classList.add('visible');
                    
                    if(index === 0) {
                        statusText.innerHTML = `पहला अक्षर है: <strong style="color:#ffeb3b">${letter}</strong>`;
                        speakText(`पहला अक्षर, ${letter}`);
                    } else {
                        statusText.innerHTML = `जुड़ा अक्षर ${index + 1}: <strong style="color:#ffeb3b">${letter}</strong> (मिलकर बना: ${word})`;
                        speakText(letter);
                    }
                }, (index + 1) * 900); // Har akshar ke aane aur bolne mein 0.9 second ka gap
            });

            // Jab saare akshar jud jayein, toh aakhri mein poora shabd dobara bole
            setTimeout(() => {
                speakText(`मिलकर बना, ${word}`);
            }, (letters.length + 1) * 900);
        }
    </script>
</body>
</html>
