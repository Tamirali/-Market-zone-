<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akshar aur Matra Vertical Blackboard</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            font-family: 'Nirmala UI', 'Mangal', 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            padding: 16px;
        }

        h2 {
            margin-bottom: 2px;
            color: #ffd700;
            text-align: center;
            font-weight: 500;
        }

        .instruction {
            color: #b0bec5;
            font-size: 15px;
            margin-bottom: 16px;
            text-align: center;
            max-width: 600px;
            line-height: 1.5;
        }

        /* Blackboard */
        .blackboard {
            width: 92%;
            max-width: 800px;
            min-height: 320px;
            background: #1b382b;
            border: 14px solid #5c4033;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            position: relative;
        }

        .chalk-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 20px 30px;
            min-height: 160px;
            padding: 10px 0;
            width: 100%;
        }

        /* Character Group - Vertical Column Layout */
        .char-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Mangal', 'Nirmala UI', sans-serif;
            min-width: 70px;
        }

        /* Base letter (Upar dikhega) */
        .base-letter {
            font-size: 60px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.8);
            opacity: 0;
            transform: translateY(-20px) scale(0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.4);
        }
        .base-letter.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Combined/Joined word/matra form (Neeche dikhega) */
        .full-letter {
            font-size: 65px;
            font-weight: 700;
            color: #ffeb3b;
            text-shadow: 0 0 15px rgba(255, 235, 59, 0.3), 2px 2px 6px rgba(0, 0, 0, 0.8);
            opacity: 0;
            transform: translateY(20px) scale(0.2);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin-top: 5px;
            min-height: 75px;
        }
        .full-letter.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Status & Audio Guide */
        .status-box {
            margin-top: 22px;
            font-size: 22px;
            color: #00e676;
            font-weight: 600;
            min-height: 42px;
            text-align: center;
            padding: 0 10px;
        }
        .status-box .highlight {
            color: #ffd700;
        }

        /* Mic Button */
        .mic-btn {
            margin-top: 18px;
            background: #ff5722;
            color: #fff;
            border: none;
            padding: 14px 34px;
            font-size: 19px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(255, 87, 34, 0.4);
            transition: background 0.3s, transform 0.15s;
            font-weight: 600;
        }
        .mic-btn:hover {
            background: #e64a19;
            transform: scale(1.02);
        }
        .mic-btn.listening {
            background: #d32f2f;
            animation: pulse 1.4s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <h2>🧑‍🏫 बच्चों का जादुई अक्षर-मात्रा ब्लैकबोर्ड</h2>
    <p class="instruction">🎤 माइक बटन दबाएँ और कोई शब्द बोलें — <strong>जैसे:</strong> सोना, कमल, आर्यन, आम</p>

    <div class="blackboard">
        <div class="chalk-container" id="chalkContainer"></div>
    </div>

    <div class="status-box" id="statusText">🎙️ माइक ऑन करके बोलना शुरू करें…</div>
    <button class="mic-btn" id="micBtn">🎤 माइक ऑन करें</button>

    <script>
        (function() {
            'use strict';

            const chalkContainer = document.getElementById('chalkContainer');
            const statusText = document.getElementById('statusText');
            const micBtn = document.getElementById('micBtn');

            let recognition = null;
            let isListening = false;
            let isAnimating = false;

            function speakText(text, callback) {
                if (!('speechSynthesis' in window)) {
                    if (callback) callback();
                    return;
                }
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                utterance.rate = 0.72;
                if (callback) utterance.onend = callback;
                window.speechSynthesis.speak(utterance);
            }

            function parseWordToUnits(word) {
                const units = [];
                let i = 0;
                const chars = [...word];

                while (i < chars.length) {
                    let ch = chars[i];
                    if (ch === ' ' || ch === '\u200B' || ch === '\u00A0') {
                        i++;
                        continue;
                    }

                    let base = ch;
                    let full = ch;

                    if (i + 1 < chars.length) {
                        const next = chars[i + 1];
                        const code = next.charCodeAt(0);
                        const isCombining = (
                            (code >= 0x0900 && code <= 0x0954) ||
                            (code >= 0x0970 && code <= 0x097F) ||
                            code === 0x093C || 
                            code === 0x094D 
                        );
                        if (isCombining) {
                            full = ch + next;
                            i++;
                        }
                    }

                    units.push({ base, full });
                    i++;
                }
                return units;
            }

            function createCharGroup(unit) {
                const group = document.createElement('div');
                group.className = 'char-group';

                // 1. Base letter (Upar)
                const baseSpan = document.createElement('span');
                baseSpan.className = 'base-letter';
                baseSpan.textContent = unit.base;
                group.appendChild(baseSpan);

                // 2. Full combined letter (Neeche)
                const fullSpan = document.createElement('span');
                fullSpan.className = 'full-letter';
                fullSpan.textContent = unit.full;
                group.appendChild(fullSpan);

                return group;
            }

            function animateWord(word) {
                if (isAnimating) return;
                isAnimating = true;

                chalkContainer.innerHTML = '';
                statusText.innerHTML = `✨ <span class="highlight">${word}</span> — सीखना शुरू…`;

                const units = parseWordToUnits(word);
                if (units.length === 0) {
                    isAnimating = false;
                    return;
                }

                const groups = [];
                units.forEach((unit) => {
                    const grp = createCharGroup(unit);
                    chalkContainer.appendChild(grp);
                    groups.push(grp);
                });

                let currentIndex = 0;

                function processUnit(index) {
                    if (index >= groups.length) {
                        statusText.innerHTML = `✅ पूरा शब्द बना: <strong style="color:#00e676;font-size:1.2em;">${word}</strong>`;
                        speakText(`मिलकर बना, ${word}`, () => {
                            isAnimating = false;
                            statusText.innerHTML = `🎉 <span class="highlight">${word}</span> — शानदार! 🔁 फिर से बोलें।`;
                        });
                        return;
                    }

                    const grp = groups[index];
                    const unit = units[index];
                    const baseEl = grp.querySelector('.base-letter');
                    const fullEl = grp.querySelector('.full-letter');

                    // Step 1: Base letter appears on top
                    baseEl.classList.add('visible');
                    statusText.innerHTML = `🔤 अक्षर: <strong class="highlight">${unit.base}</strong>`;

                    speakText(unit.base, () => {
                        setTimeout(() => {
                            // Step 2: Joined/Matra form appears right below it
                            fullEl.classList.add('visible');
                            statusText.innerHTML = `➕ मात्रा के साथ: <strong style="color:#ffeb3b;font-size:1.1em;">${unit.full}</strong>`;

                            speakText(unit.full, () => {
                                setTimeout(() => {
                                    currentIndex++;
                                    processUnit(currentIndex);
                                }, 400);
                            });
                        }, 300);
                    });
                }

                processUnit(0);
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'hi-IN';
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;

                recognition.onstart = function() {
                    isListening = true;
                    micBtn.classList.add('listening');
                    micBtn.textContent = '🛑 सुन रहा हूँ…';
                    statusText.textContent = '🎧 सुन रहा हूँ… बोलिए!';
                };

                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript.trim();
                    if (transcript) animateWord(transcript);
                };

                recognition.onerror = function() {
                    stopListeningState();
                };

                recognition.onend = function() {
                    stopListeningState();
                };
            }

            window.toggleListening = function() {
                if (!recognition) return;
                if (isListening) {
                    recognition.stop();
                } else {
                    if (!isAnimating) chalkContainer.innerHTML = '';
                    try { recognition.start(); } catch (e) {}
                }
            };

            function stopListeningState() {
                isListening = false;
                micBtn.classList.remove('listening');
                micBtn.textContent = '🎤 माइक ऑन करें';
            }

            micBtn.addEventListener('click', window.toggleListening);
        })();
    </script>
</body>
</html>
