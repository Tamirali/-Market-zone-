<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akshar & Matra Interactive Blackboard</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            font-family: 'Nirmala UI', 'Mangal', 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #ffffff;
        }

        h2 {
            margin-bottom: 5px;
            color: #ffd700;
            text-align: center;
        }

        p.instruction {
            color: #b0bec5;
            font-size: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Traditional Greenish-Black Board Design */
        .blackboard {
            width: 85%;
            max-width: 750px;
            height: 380px;
            background-color: #1b382b; 
            border: 14px solid #5c4033; 
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
        }

        /* Chalk Text Container */
        .chalk-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            min-height: 120px;
        }

        /* Individual Letters / Matras Animation */
        .chalk-item {
            font-family: 'Mangal', 'Nirmala UI', sans-serif;
            font-size: 70px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.7);
            opacity: 0;
            transform: scale(0.1);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .chalk-item.visible {
            opacity: 1;
            transform: scale(1);
        }

        /* Status & Audio Guide Box */
        .status-box {
            margin-top: 25px;
            font-size: 22px;
            color: #00e676;
            font-weight: bold;
            min-height: 35px;
            text-align: center;
        }

        /* Mic Button */
        .mic-btn {
            margin-top: 20px;
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background 0.3s;
        }

        .mic-btn:hover {
            background-color: #e64a19;
        }

        .mic-btn.listening {
            background-color: #d32f2f;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <h2>बच्चों का अक्षर और मात्रा सीखने वाला बोर्ड</h2>
    <p class="instruction">माइक बटन दबाएं और शब्द बोलें (जैसे: सोना, कमल, किताब, आम)</p>

    <div class="blackboard">
        <div class="chalk-container" id="chalkContainer">
            <!-- Separated Akshar and Matras will render here -->
        </div>
    </div>

    <div class="status-box" id="statusText">माइक ऑन करके बोलना शुरू करें...</div>

    <button class="mic-btn" id="micBtn" onclick="toggleListening()">🎤 माइक ऑन करें</button>

    <script>
        const chalkContainer = document.getElementById('chalkContainer');
        const statusText = document.getElementById('statusText');
        const micBtn = document.getElementById('micBtn');

        let recognition;
        let isListening = false;

        // Text-to-Speech function
        function speakText(text, callback) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                utterance.rate = 0.75; // Thoda dheere taaki bachche samajh sakein
                if (callback) {
                    utterance.onend = callback;
                }
                window.speechSynthesis.speak(utterance);
            }
        }

        // Web Speech API Initialization
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                isListening = true;
                micBtn.classList.add('listening');
                micBtn.innerText = "🛑 सुन रहा हूँ...";
                statusText.innerText = "ध्यान से सुन रहा हूँ...";
            };

            recognition.onresult = function(event) {
                const spokenText = event.results[0][0].transcript.trim();
                breakIntoAksharAndMatra(spokenText);
            };

            recognition.onerror = function(event) {
                statusText.innerText = "आवाज़ स्पष्ट नहीं आई, दोबारा बोलें।";
                stopListeningState();
            };

            recognition.onend = function() {
                stopListeningState();
            };
        } else {
            statusText.innerText = "आपका ब्राउज़र स्पीच रिकग्निशन को सपोर्ट नहीं करता।";
            micBtn.style.display = 'none';
        }

        function toggleListening() {
            if (!recognition) return;
            if (isListening) {
                recognition.stop();
            } else {
                chalkContainer.innerHTML = '';
                recognition.start();
            }
        }

        function stopListeningState() {
            isListening = false;
            micBtn.classList.remove('listening');
            micBtn.innerText = "🎤 माइक ऑन करें";
        }

        // Function to split word into base consonants and independent matras/signs
        function breakIntoAksharAndMatra(word) {
            statusText.innerHTML = `बोला गया शब्द: <span style="color:#ffd700">${word}</span>`;
            chalkContainer.innerHTML = '';

            let elements = [];
            
            for (let i = 0; i < word.length; i++) {
                let char = word[i];
                let code = char.charCodeAt(0);

                // Check if it's a matra or vowel sign / nukta / halant / anuswar
                let isMatraOrSign = (code >= 0x0901 && code <= 0x0903) || 
                                    (code >= 0x093E && code <= 0x094C) || 
                                    (code === 0x094D) ||
                                    (code === 0x093C);

                if (isMatraOrSign && elements.length > 0) {
                    // Separate matra as its own element item so it appears distinctly
                    elements.push({ type: 'matra', char: char });
                } else {
                    if (char !== ' ') {
                        elements.push({ type: 'akshar', char: char });
                    }
                }
            }

            // Animate and speak step-by-step sequentially
            let index = 0;
            function showNextElement() {
                if (index < elements.length) {
                    let item = elements[index];
                    const span = document.createElement('span');
                    span.classList.add('chalk-item');
                    span.innerText = item.char;
                    chalkContainer.appendChild(span);

                    // Trigger visual pop-up
                    setTimeout(() => {
                        span.classList.add('visible');
                    }, 50);

                    // Determine speech text based on type
                    let speechString = item.char;
                    if (item.type === 'matra') {
                        statusText.innerHTML = `मात्रा जुड़ी: <strong style="color:#ffeb3b">${item.char}</strong>`;
                    } else {
                        statusText.innerHTML = `अक्षर आया: <strong style="color:#ffeb3b">${item.char}</strong>`;
                    }

                    // Speak and move to next element after audio finishes
                    speakText(speechString, () => {
                        index++;
                        setTimeout(showNextElement, 500); // 0.5 sec gap between steps
                    });
                } else {
                    // All elements shown, now speak the final complete word
                    setTimeout(() => {
                        statusText.innerHTML = `पूरा शब्द बना: <strong style="color:#00e676">${word}</strong>`;
                        speakText(`मिलकर बना, ${word}`);
                    }, 600);
                }
            }

            // Start sequence
            speakText(`शब्द है`, () => {
                showNextElement();
            });
        }
    </script>
</body>
</html>
