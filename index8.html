<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akshar aur Matra Animation Blackboard</title>
    <style>
        /* ----- Reset & Base ----- */
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            font-family: 'Nirmala UI', 'Mangal', 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            padding: 16px;
        }

        h2 {
            margin-bottom: 2px;
            color: #ffd700;
            text-align: center;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .instruction {
            color: #b0bec5;
            font-size: 15px;
            margin-bottom: 16px;
            text-align: center;
            max-width: 600px;
            line-height: 1.5;
        }

        /* ----- Blackboard ----- */
        .blackboard {
            width: 92%;
            max-width: 800px;
            min-height: 300px;
            background: #1b382b;
            border: 14px solid #5c4033;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 0 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            position: relative;
        }

        /* Chalk container – flexible row */
        .chalk-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px 28px;
            min-height: 140px;
            padding: 10px 0;
            width: 100%;
        }

        /* ----- Character Group (relative anchor) ----- */
        .char-group {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-family: 'Mangal', 'Nirmala UI', sans-serif;
            font-size: 80px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.8);
            min-width: 80px;
            min-height: 100px;
            line-height: 1.2;
            /* Prevent any accidental extra circle */
            font-variant: none;
            font-feature-settings: "zero" 0, "dlig" 0;
        }

        /* ----- Base letter (bottom layer) ----- */
        .base-letter {
            display: inline-block;
            opacity: 0;
            transform: scale(0.2) rotate(-6deg);
            transition: all 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.4);
            position: relative;
            z-index: 1;
            /* base sits below the full-letter */
        }
        .base-letter.visible {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        /* ----- Full combined character (top layer) ----- */
        .full-letter {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.3) translateY(-60px);
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 2;
            pointer-events: none;
            /* Matra highlight (golden) */
            color: #ffeb3b;
            text-shadow: 0 0 20px rgba(255, 235, 59, 0.3), 3px 3px 8px rgba(0, 0, 0, 0.8);
            font-size: inherit;
            line-height: inherit;
            font-family: inherit;
            font-weight: inherit;
            white-space: nowrap;
        }
        .full-letter.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1) translateY(0);
        }

        /* subtle glow when matra attaches */
        .full-letter.visible {
            filter: drop-shadow(0 0 10px rgba(255, 235, 59, 0.25));
        }

        /* ----- Status & Audio Guide ----- */
        .status-box {
            margin-top: 22px;
            font-size: 22px;
            color: #00e676;
            font-weight: 600;
            min-height: 42px;
            text-align: center;
            padding: 0 10px;
            line-height: 1.4;
        }
        .status-box .highlight {
            color: #ffd700;
        }

        /* ----- Mic Button ----- */
        .mic-btn {
            margin-top: 18px;
            background: #ff5722;
            color: #fff;
            border: none;
            padding: 14px 34px;
            font-size: 19px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(255, 87, 34, 0.4);
            transition: background 0.3s, transform 0.15s;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .mic-btn:hover {
            background: #e64a19;
            transform: scale(1.02);
        }
        .mic-btn:active {
            transform: scale(0.96);
        }
        .mic-btn.listening {
            background: #d32f2f;
            animation: pulse 1.4s infinite;
            box-shadow: 0 0 30px rgba(211, 47, 47, 0.5);
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.06);
            }
            100% {
                transform: scale(1);
            }
        }

        /* ----- Responsive tweaks ----- */
        @media (max-width: 600px) {
            .blackboard {
                min-height: 220px;
                padding: 16px 10px;
                border-width: 10px;
            }
            .char-group {
                font-size: 54px;
                min-width: 56px;
                min-height: 70px;
            }
            .chalk-container {
                gap: 6px 16px;
                min-height: 100px;
            }
            .status-box {
                font-size: 18px;
                min-height: 34px;
            }
            .mic-btn {
                padding: 10px 22px;
                font-size: 16px;
            }
            h2 {
                font-size: 20px;
            }
            .instruction {
                font-size: 13px;
            }
        }

        @media (max-width: 400px) {
            .char-group {
                font-size: 40px;
                min-width: 42px;
                min-height: 54px;
            }
            .chalk-container {
                gap: 4px 10px;
            }
            .blackboard {
                padding: 12px 6px;
            }
            .status-box {
                font-size: 15px;
            }
        }

        /* small chalk dust effect (just for fun) */
        .blackboard::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 20px;
            right: 20px;
            bottom: 10px;
            background: radial-gradient(ellipse at 30% 20%, rgba(255, 255, 255, 0.03) 0%, transparent 70%);
            pointer-events: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h2>🧑‍🏫 बच्चों का जादुई अक्षर-मात्रा ब्लैकबोर्ड</h2>
    <p class="instruction">🎤 माइक बटन दबाएँ और कोई शब्द बोलें — <strong>जैसे:</strong> सोना, कमल, तारा, आम, रोशनी</p>

    <div class="blackboard">
        <div class="chalk-container" id="chalkContainer">
            <!-- Dynamic characters appear here -->
        </div>
    </div>

    <div class="status-box" id="statusText">🎙️ माइक ऑन करके बोलना शुरू करें…</div>

    <button class="mic-btn" id="micBtn">🎤 माइक ऑन करें</button>

    <script>
        (function() {
            'use strict';

            // ----- DOM refs -----
            const chalkContainer = document.getElementById('chalkContainer');
            const statusText = document.getElementById('statusText');
            const micBtn = document.getElementById('micBtn');

            // ----- State -----
            let recognition = null;
            let isListening = false;
            let isAnimating = false; // block new speech while animating

            // ----- Speech Synthesis helper -----
            function speakText(text, callback) {
                if (!('speechSynthesis' in window)) {
                    if (callback) callback();
                    return;
                }
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                utterance.rate = 0.72;
                utterance.pitch = 1.0;
                if (callback) {
                    utterance.onend = callback;
                } else {
                    utterance.onend = null;
                }
                window.speechSynthesis.speak(utterance);
            }

            // ----- Parse Devanagari word into units -----
            // Returns array of { base, matra, full }
            function parseWordToUnits(word) {
                const units = [];
                let i = 0;
                const chars = [...word]; // handle Unicode correctly

                while (i < chars.length) {
                    let ch = chars[i];
                    // skip spaces
                    if (ch === ' ' || ch === '\u200B' || ch === '\u00A0') {
                        i++;
                        continue;
                    }

                    let base = ch;
                    let matra = '';
                    let full = ch;

                    // Check if next char is a combining mark (matra, anusvara, visarga, halant, etc.)
                    if (i + 1 < chars.length) {
                        const next = chars[i + 1];
                        const code = next.charCodeAt(0);
                        // Devanagari combining marks range: 0x0900–0x0954, plus 0x0970–0x097F (some extensions)
                        const isCombining = (
                            (code >= 0x0900 && code <= 0x0954) ||
                            (code >= 0x0970 && code <= 0x097F) ||
                            code === 0x093C || // nukta
                            code === 0x094D // halant (virama)
                        );
                        if (isCombining) {
                            matra = next;
                            full = ch + next;
                            i++; // consume the combining char
                        }
                    }

                    units.push({ base, matra, full });
                    i++;
                }
                return units;
            }

            // ----- Render a character group (two-layer) -----
            function createCharGroup(unit) {
                const group = document.createElement('div');
                group.className = 'char-group';

                // 1. Base letter (bottom)
                const baseSpan = document.createElement('span');
                baseSpan.className = 'base-letter';
                baseSpan.textContent = unit.base;
                group.appendChild(baseSpan);

                // 2. Full combined letter (top, positioned absolutely)
                const fullSpan = document.createElement('span');
                fullSpan.className = 'full-letter';
                fullSpan.textContent = unit.full; // base + matra (or just base)
                group.appendChild(fullSpan);

                return group;
            }

            // ----- Main animation sequence for a word -----
            function animateWord(word) {
                if (isAnimating) return;
                isAnimating = true;

                // Clear board
                chalkContainer.innerHTML = '';
                statusText.innerHTML = `✨ <span class="highlight">${word}</span> — सीखना शुरू…`;

                const units = parseWordToUnits(word);
                if (units.length === 0) {
                    statusText.textContent = '⚠️ कुछ नहीं मिला, फिर बोलें।';
                    isAnimating = false;
                    return;
                }

                // Build all character groups (hidden initially)
                const groups = [];
                units.forEach((unit, idx) => {
                    const grp = createCharGroup(unit);
                    chalkContainer.appendChild(grp);
                    groups.push(grp);
                });

                let currentIndex = 0;
                let allSoundsDone = false;

                // Function to process one unit at a time
                function processUnit(index) {
                    if (index >= groups.length) {
                        // All units done → speak the complete word
                        statusText.innerHTML = `✅ पूरा शब्द बना: <strong style="color:#00e676;font-size:1.2em;">${word}</strong>`;
                        speakText(`मिलकर बना, ${word}`, () => {
                            isAnimating = false;
                            statusText.innerHTML = `🎉 <span class="highlight">${word}</span> — शानदार! 🔁 फिर से बोलें।`;
                        });
                        return;
                    }

                    const grp = groups[index];
                    const unit = units[index];
                    const baseEl = grp.querySelector('.base-letter');
                    const fullEl = grp.querySelector('.full-letter');

                    // ---- STEP 1: Show base letter with pop animation ----
                    baseEl.classList.add('visible');
                    statusText.innerHTML = `🔤 अक्षर आया: <strong class="highlight">${unit.base}</strong>`;

                    // ---- STEP 2: Speak the base sound ----
                    speakText(unit.base, () => {
                        // ---- STEP 3: After a short pause, show the matra (full combined) ----
                        setTimeout(() => {
                            if (unit.matra) {
                                // Has matra → fly-in animation
                                fullEl.classList.add('visible');
                                statusText.innerHTML =
                                    `➕ मात्रा जुड़ी: <strong style="color:#ffeb3b;font-size:1.1em;">${unit.full}</strong>`;

                                // ---- STEP 4: Speak combined sound immediately after matra appears ----
                                // small delay so the eye catches the movement
                                setTimeout(() => {
                                    speakText(unit.full, () => {
                                        // move to next unit after a small gap
                                        setTimeout(() => {
                                            currentIndex++;
                                            processUnit(currentIndex);
                                        }, 350);
                                    });
                                }, 280);
                            } else {
                                // No matra → just move on
                                setTimeout(() => {
                                    currentIndex++;
                                    processUnit(currentIndex);
                                }, 400);
                            }
                        }, 380);
                    });
                }

                // Start the sequence
                processUnit(0);
            }

            // ----- Process spoken word (called from recognition) -----
            function processSmartWord(spokenText) {
                if (isAnimating) {
                    statusText.textContent = '⏳ पहले शब्द खत्म होने दें, फिर बोलें…';
                    return;
                }

                // Clean the spoken text
                const cleaned = spokenText.trim();
                if (!cleaned) {
                    statusText.textContent = '⚠️ कुछ नहीं सुना, फिर बोलें।';
                    return;
                }

                // Show what was heard
                statusText.innerHTML = `🎤 बोला गया: <span class="highlight">${cleaned}</span>`;

                // Start animation
                animateWord(cleaned);
            }

            // ============================================================
            // ----- Speech Recognition Setup -----
            // ============================================================
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'hi-IN';
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;
                recognition.continuous = false;

                recognition.onstart = function() {
                    isListening = true;
                    micBtn.classList.add('listening');
                    micBtn.textContent = '🛑 सुन रहा हूँ…';
                    if (!isAnimating) {
                        statusText.textContent = '🎧 सुन रहा हूँ… बोलिए!';
                    }
                };

                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript.trim();
                    if (transcript) {
                        processSmartWord(transcript);
                    } else {
                        statusText.textContent = '⚠️ आवाज़ नहीं आई, दोबारा बोलें।';
                    }
                };

                recognition.onerror = function(event) {
                    let msg = '❌ आवाज़ स्पष्ट नहीं, दोबारा बोलें।';
                    if (event.error === 'no-speech') msg = '🤐 कुछ बोला नहीं, माइक दबाकर बोलें।';
                    else if (event.error === 'audio-capture') msg = '🎤 माइक नहीं मिला, अनुमति दें।';
                    else if (event.error === 'not-allowed') msg = '🚫 माइक अनुमति नहीं, ब्राउज़र सेटिंग चेक करें।';
                    statusText.textContent = msg;
                    stopListeningState();
                };

                recognition.onend = function() {
                    stopListeningState();
                };
            } else {
                statusText.textContent = '⚠️ आपका ब्राउज़र स्पीच रिकग्निशन सपोर्ट नहीं करता।';
                micBtn.style.display = 'none';
            }

            // ----- Mic button toggle -----
            window.toggleListening = function() {
                if (!recognition) return;
                if (isListening) {
                    recognition.stop();
                } else {
                    // Clear board if idle
                    if (!isAnimating) {
                        chalkContainer.innerHTML = '';
                    }
                    try {
                        recognition.start();
                    } catch (e) {
                        // might already be started
                        statusText.textContent = '⏳ माइक शुरू हो रहा है…';
                    }
                }
            };

            function stopListeningState() {
                isListening = false;
                micBtn.classList.remove('listening');
                micBtn.textContent = '🎤 माइक ऑन करें';
                if (!isAnimating && statusText.textContent.includes('सुन रहा')) {
                    statusText.textContent = '🎙️ माइक ऑन करके बोलना शुरू करें…';
                }
            }

            // ----- Handle mic click via event listener (so we can use the function) -----
            micBtn.addEventListener('click', window.toggleListening);

            // ============================================================
            // ----- Demo: auto-show a sample on load (optional) -----
            // ============================================================
            // Uncomment below to auto-demo "सोना" on page load:
            // setTimeout(() => { animateWord('सोना'); }, 800);

            console.log('✅ Akshar-Matra Blackboard ready!');
        })();
    </script>

</body>
</html>
