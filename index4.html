<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ महासंग्रह Ultra AI — अक्ल की जीत</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #030308; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        
        .app-card {
            width: 100%; max-width: 550px; height: 94vh;
            background: radial-gradient(circle at top left, #120b29, #05050f);
            border: 1.5px solid rgba(0, 255, 204, 0.3);
            border-radius: 28px; display: flex; flex-direction: column;
            box-shadow: 0 0 60px rgba(0, 255, 204, 0.15), 0 0 120px rgba(168, 85, 247, 0.1);
            overflow: hidden;
        }

        .header {
            padding: 16px; background: rgba(8, 8, 20, 0.8);
            border-bottom: 1px solid rgba(0, 255, 204, 0.2);
            display: flex; justify-content: space-between; align-items: center;
        }
        .header h2 {
            font-size: 18px; font-weight: 900;
            background: linear-gradient(90deg, #00ffcc, #ff007f, #ffaa00);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .config-box {
            padding: 10px 14px; background: rgba(0, 0, 0, 0.5);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08); display: flex; gap: 8px;
        }
        .config-box input {
            flex: 1; padding: 8px 14px; border-radius: 20px;
            border: 1px solid rgba(0, 255, 204, 0.3); background: #080814;
            color: #00ffcc; font-size: 12px; outline: none;
        }

        .chat-area {
            flex: 1; padding: 16px; overflow-y: auto; display: flex;
            flex-direction: column; gap: 14px; scroll-behavior: smooth;
        }

        .msg-group { display: flex; flex-direction: column; max-width: 88%; }
        .msg-group.user { align-self: flex-end; }
        .msg-group.ai { align-self: flex-start; }

        .bubble {
            padding: 14px 18px; border-radius: 20px; font-size: 14px;
            line-height: 1.6; word-break: break-word; white-space: pre-wrap;
        }
        .user .bubble {
            background: linear-gradient(135deg, #7c3aed, #2563eb); color: #fff;
            border-bottom-right-radius: 4px; box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3);
        }
        .ai .bubble {
            background: rgba(255, 255, 255, 0.05); color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.12); border-bottom-left-radius: 4px;
        }

        .actions { display: flex; gap: 12px; margin-top: 6px; font-size: 11px; color: #a1a1aa; }
        .actions span { cursor: pointer; transition: 0.2s; }
        .actions span:hover { color: #00ffcc; }

        .input-bar {
            padding: 12px; background: rgba(5, 5, 12, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.08); display: flex; gap: 8px; align-items: center;
        }
        .input-bar textarea {
            flex: 1; padding: 10px 16px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15); background: #0a0a16;
            color: #fff; outline: none; font-size: 14px; resize: none; height: 44px;
        }
        .input-bar textarea:focus { border-color: #00ffcc; }

        .btn {
            background: linear-gradient(135deg, #00ffcc, #0088ff); color: #000;
            border: none; width: 42px; height: 42px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 16px; font-weight: bold; flex-shrink: 0;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.08); }
        .btn-secondary { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); }
        .btn-secondary.active { background: #ff0055; animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 0, 85, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0); }
        }
    </style>
</head>
<body>

    <div class="app-card">
        <div class="header">
            <h2>⚡ महासंग्रह Ultra AI</h2>
            <button class="btn btn-secondary" style="width:auto; padding:0 12px; border-radius:12px; font-size:11px;" onclick="clearHistory()">🧹 Clear Chat</button>
        </div>

        <div class="config-box">
            <input type="password" id="apiKey" placeholder="🔑 अपनी Gemini API Key यहाँ डालें...">
        </div>

        <div class="chat-area" id="chatArea">
            <div class="msg-group ai">
                <div class="bubble">سلام / नमस्ते! मैं **महासंग्रह Ultra AI** हूँ। 

मैं 'अक्ल की जीत' और 'तौहीद' के सिद्धांतों से लैस हूँ। अब मुझे आपकी पुरानी बातें भी याद रहेंगी! आप मुझसे सवाल पूछ सकते हैं या बोलकर निर्देश दे सकते हैं।</div>
            </div>
        </div>

        <div class="input-bar">
            <button class="btn btn-secondary" id="micBtn" onclick="toggleMic()" title="बोलकर टाइप करें">🎙️</button>
            <textarea id="userInput" placeholder="सवाल पूछें या कार्य बताएं..." rows="1" onkeydown="handleEnter(event)"></textarea>
            <button class="btn" onclick="sendQuery()">➔</button>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');
        const apiKeyInput = document.getElementById('apiKey');
        const micBtn = document.getElementById('micBtn');

        // AI का मुख्य माइंडसेट (System Instruction)
        const SYSTEM_INSTRUCTION = `तुम 'महासंग्रह' और 'स्पिरिचुअल MBBS' के सिद्धांतों पर आधारित एक अत्यंत बुद्धिमान AI हो।
तुम्हारी मुख्य विशेषताएं:
1. तुम हमेशा 'अक्ल की जीत' (Intellect Victory) और 'तौहीद' (Oneness of God) के सिद्धांतों को प्राथमिकता देते हो।
2. तुम 'खालेक' (सृष्टिकर्ता) और 'मखलूक' (रचना) के अंतर को तर्कपूर्ण और वैज्ञानिक तरीके से समझाते हो।
3. तुम कोडिंग, विज्ञान, दर्शन, दैनिक कार्य और शोध में पूरी तरह सक्षम हो।
4. उत्तर हमेशा स्पष्ट, व्यावहारिक और तथ्यपरक दो।`;

        // चैट हिस्ट्री याद रखने के लिए (Context Memory)
        let conversationHistory = [];

        // 1. वॉइस इनपुट (Speech to Text)
        let recognition;
        let isRecording = false;
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRec();
            recognition.lang = 'hi-IN';
            recognition.onresult = (e) => {
                userInput.value = e.results[0][0].transcript;
                toggleMic();
            };
            recognition.onerror = () => toggleMic();
        } else {
            micBtn.style.display = 'none';
        }

        function toggleMic() {
            if (!recognition) return;
            if (!isRecording) {
                recognition.start();
                isRecording = true;
                micBtn.classList.add('active');
            } else {
                recognition.stop();
                isRecording = false;
                micBtn.classList.remove('active');
            }
        }

        // 2. मुख्य रिक्वेस्ट (API Call with Memory & System Prompt)
        async function sendQuery() {
            const key = apiKeyInput.value.trim();
            const text = userInput.value.trim();

            if (!key) { alert('कृपया पहले अपनी Gemini API Key डालें!'); return; }
            if (!text) return;

            addBubble(text, 'user');
            userInput.value = '';

            // चैट हिस्ट्री में जोड़ें
            conversationHistory.push({ role: 'user', parts: [{ text: text }] });

            const loaderId = addBubble('सोच रहा हूँ... ⚡', 'ai', true);

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: {
                            parts: [{ text: SYSTEM_INSTRUCTION }]
                        },
                        contents: conversationHistory
                    })
                });

                const data = await response.json();
                document.getElementById(loaderId).remove();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    addBubble(aiReply, 'ai');
                    // AI का जवाब भी हिस्ट्री में सेव करें
                    conversationHistory.push({ role: 'model', parts: [{ text: aiReply }] });
                } else {
                    addBubble('क्षमा करें, उत्तर प्राप्त नहीं हुआ। Key या नेटवर्क की जाँच करें।', 'ai');
                }
            } catch (err) {
                if(document.getElementById(loaderId)) document.getElementById(loaderId).remove();
                addBubble('त्रुटि: सर्वर से जुड़ने में समस्या हुई।', 'ai');
            }
        }

        // 3. UI बबल्स बनाना
        function addBubble(text, sender, isLoading = false) {
            const group = document.createElement('div');
            group.className = `msg-group ${sender}`;
            const id = 'msg-' + Date.now();
            if (isLoading) group.id = id;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerText = text;
            group.appendChild(bubble);

            if (sender === 'ai' && !isLoading) {
                const actions = document.createElement('div');
                actions.className = 'actions';

                const copy = document.createElement('span');
                copy.innerText = '📋 Copy';
                copy.onclick = () => {
                    navigator.clipboard.writeText(text);
                    copy.innerText = '✅ Copied!';
                    setTimeout(() => copy.innerText = '📋 Copy', 2000);
                };

                const speak = document.createElement('span');
                speak.innerText = '🔊 Listen';
                speak.onclick = () => speakText(text);

                actions.appendChild(copy);
                actions.appendChild(speak);
                group.appendChild(actions);
            }

            chatArea.appendChild(group);
            chatArea.scrollTop = chatArea.scrollHeight;
            return id;
        }

        // 4. वॉइस आउटपुट
        function speakText(text) {
            window.speechSynthesis.cancel();
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'hi-IN';
            window.speechSynthesis.speak(speech);
        }

        // 5. क्लियर हिस्ट्री
        function clearHistory() {
            conversationHistory = [];
            chatArea.innerHTML = `<div class="msg-group ai"><div class="bubble">चैट रीसेट हो गई है। नया सवाल पूछें!</div></div>`;
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendQuery();
            }
        }
    </script>
</body>
</html>
