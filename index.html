<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌌 महासंग्रह: नई पीढ़ी</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body,
        html {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: #0a0a14;
            color: #fff;
            overflow-x: hidden;
        }

        .mobile-screen {
            display: flex;
            flex-direction: column;
            width: 100vw;
            min-height: 100vh;
            max-width: 500px;
            border: 2px solid rgba(0, 255, 255, 0.25);
            border-radius: 32px;
            margin: 0 auto;
            position: relative;
            background: radial-gradient(ellipse at 30% 20%, #1b0f30, #070712 80%);
            overflow-y: auto;
            box-shadow: 0 0 80px rgba(0, 150, 255, 0.15), 0 0 160px rgba(255, 0, 150, 0.08);
            backdrop-filter: blur(2px);
        }

        /* 🏷️ मार्केट बैनर */
        #marketOverlay {
            position: absolute;
            top: 12px;
            width: 92%;
            left: 4%;
            text-align: center;
            z-index: 20;
            display: none;
            padding: 16px 20px;
            pointer-events: none;
            background: rgba(8, 8, 30, 0.65);
            backdrop-filter: blur(14px);
            border-radius: 60px;
            border: 1.5px solid rgba(0, 255, 255, 0.4);
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.15), inset 0 0 50px rgba(255, 0, 200, 0.05);
            animation: borderPulse 3s infinite alternate;
        }
        @keyframes borderPulse {
            0% {
                border-color: rgba(0, 255, 255, 0.3);
                box-shadow: 0 0 30px rgba(0, 255, 255, 0.1);
            }
            100% {
                border-color: rgba(255, 0, 200, 0.6);
                box-shadow: 0 0 60px rgba(255, 0, 200, 0.25), 0 0 120px rgba(0, 200, 255, 0.1);
            }
        }

        #marketOverlay h2 {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ff0080, #ff8c00, #40e0d0, #ff0080);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 3s ease infinite;
            margin-bottom: 4px;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #marketOverlay p {
            color: #b0e0ff;
            font-size: 15px;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.4);
            display: inline-block;
            padding: 4px 22px;
            border-radius: 40px;
            border: 1px solid rgba(0, 200, 255, 0.3);
            backdrop-filter: blur(4px);
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.2);
        }

        /* 🌌 यूनिवर्स सेक्शन */
        .universe-section {
            height: 50vh;
            background: radial-gradient(circle at 40% 30%, #1f0f3a, #05020a 85%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid rgba(255, 215, 0, 0.15);
            overflow: hidden;
        }

        .singularity {
            width: 22px;
            height: 22px;
            background: radial-gradient(circle, #ffffff, #ffdd44, #ff4400);
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 50px #fff, 0 0 100px #ffaa00, 0 0 180px #ff0066;
            display: none;
            z-index: 10;
        }
        .singularity-heartbeat {
            animation: heartbeat 0.7s ease-in-out 4 alternate forwards;
        }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            100% {
                transform: scale(5);
                box-shadow: 0 0 100px #ffdd00, 0 0 200px #ff4400, 0 0 300px #ff0088;
            }
        }

        .big-bang-flash {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #fffbe6, #ffcc66, #ff5500);
            opacity: 0;
            z-index: 15;
            pointer-events: none;
        }
        .flash-active {
            animation: flashAnim 1s ease-out forwards;
        }
        @keyframes flashAnim {
            0% { opacity: 0; }
            20% { opacity: 1; }
            100% { opacity: 0; }
        }

        .cosmos {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 2.2s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cosmos.visible {
            opacity: 1;
        }

        .sun {
            width: 38px;
            height: 38px;
            background: radial-gradient(circle, #fff7a0, #ffbb00, #ff5500);
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 50px #ffaa00, 0 0 120px #ff4400, 0 0 200px #ff0080;
            z-index: 5;
            animation: pulseSun 2s infinite alternate;
        }
        @keyframes pulseSun {
            0% { transform: scale(1); }
            100% {
                transform: scale(1.2);
                box-shadow: 0 0 80px #ffdd44, 0 0 180px #ff6600, 0 0 260px #ff0088;
            }
        }

        .orbit {
            border: 1px dashed rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            position: absolute;
            animation: orbitRotate linear infinite;
        }
        @keyframes orbitRotate {
            100% { transform: rotate(360deg); }
        }

        .planet {
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 15px currentColor;
        }
        .mercury-orbit { width: 45px; height: 45px; animation-duration: 3s; }
        .mercury { width: 4px; height: 4px; background: #b0b0b0; color: #b0b0b0; }
        .venus-orbit { width: 65px; height: 65px; animation-duration: 5s; }
        .venus { width: 6px; height: 6px; background: #f5c76b; color: #f5c76b; }
        .earth-orbit { width: 95px; height: 95px; animation-duration: 8s; }
        .earth-system {
            width: 26px;
            height: 26px;
            position: absolute;
            top: -13px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .earth {
            width: 10px;
            height: 10px;
            background: radial-gradient(circle at 30% 30%, #6fc3ff, #1a6b9e);
            box-shadow: 0 0 14px #3a8ec4;
            border-radius: 50%;
            z-index: 2;
        }
        .moon-orbit {
            width: 24px;
            height: 24px;
            border: 0.5px dotted rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            position: absolute;
            animation: orbitRotate 2s linear infinite;
        }
        .moon {
            width: 3px;
            height: 3px;
            background: #e8e8e8;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 50%;
            box-shadow: 0 0 6px #ccc;
        }
        .mars-orbit { width: 125px; height: 125px; animation-duration: 11s; }
        .mars { width: 6px; height: 6px; background: #e07040; color: #e07040; }
        .jupiter-orbit { width: 160px; height: 160px; animation-duration: 15s; }
        .jupiter { width: 13px; height: 13px; background: radial-gradient(circle at 40% 40%, #f5d78c, #b8863a); color: #f5d78c; }
        .saturn-orbit { width: 195px; height: 195px; animation-duration: 20s; }
        .saturn { width: 11px; height: 11px; background: radial-gradient(circle at 30% 30%, #f0e2b0, #c8a86a); color: #f0e2b0; }
        .uranus-orbit { width: 230px; height: 230px; animation-duration: 25s; }
        .uranus { width: 8px; height: 8px; background: #8ed4c9; color: #8ed4c9; }
        .neptune-orbit { width: 265px; height: 265px; animation-duration: 30s; }
        .neptune { width: 7px; height: 7px; background: #5a7fd4; color: #5a7fd4; }

        /* 📚 लाइब्रेरी */
        .library-horizontal-section {
            background: linear-gradient(135deg, #100c22, #1f1140);
            border-bottom: 2px solid rgba(255, 200, 0, 0.15);
            padding: 18px 14px;
            display: flex;
            flex-direction: column;
            border-radius: 0 0 28px 28px;
            box-shadow: inset 0 10px 40px rgba(255, 0, 200, 0.05);
            min-height: 160px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .controls h4 {
            color: #d4bfff;
            font-size: 17px;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(180, 130, 255, 0.3);
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 18px;
            border-radius: 40px;
            border: 1px solid rgba(200, 150, 255, 0.2);
            backdrop-filter: blur(4px);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        /* 🔘 सभी बटन */
        .edit-btn,
        .save-btn,
        .add-btn,
        .library-hz-btn,
        .click-btn {
            font-weight: 800;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .edit-btn {
            background: linear-gradient(135deg, #ffaa33, #ff5500);
            color: #fff;
            padding: 14px 28px;
            font-size: 18px;
            border: 2px solid #ffcc44;
            text-shadow: 0 0 15px rgba(255, 200, 0, 0.4);
        }
        .edit-btn:hover {
            transform: scale(1.06) translateY(-2px);
            box-shadow: 0 0 50px #ff8800, 0 0 100px #ff4400;
        }
        .edit-btn.active {
            background: linear-gradient(135deg, #00cc88, #00aa66);
            border-color: #88ffbb;
            box-shadow: 0 0 30px #00ff88;
        }

        .save-btn {
            background: linear-gradient(135deg, #00f5a0, #00b4f5);
            color: #0a0a1a;
            padding: 14px 30px;
            font-size: 18px;
            border: 2px solid #88ffdd;
            display: none;
            text-shadow: 0 0 15px rgba(0, 255, 200, 0.4);
        }
        .save-btn:hover {
            transform: scale(1.06) translateY(-2px);
            box-shadow: 0 0 50px #00ffaa, 0 0 100px #00ccff;
        }
        .save-btn.show {
            display: inline-flex;
        }

        .add-btn {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            color: #fff;
            padding: 14px 24px;
            font-size: 18px;
            border: 2px solid #c084fc;
            text-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }
        .add-btn:hover {
            transform: scale(1.06) translateY(-2px);
            box-shadow: 0 0 50px #a855f7, 0 0 100px #7c3aed;
        }

        /* 📖 चैप्टर बटन */
        .horizontal-scroll-container {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 8px 4px 16px 4px;
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: #ff44aa #1a0a2e;
            min-height: 80px;
            align-items: center;
        }
        .horizontal-scroll-container::-webkit-scrollbar {
            height: 8px;
        }
        .horizontal-scroll-container::-webkit-scrollbar-track {
            background: #110a22;
            border-radius: 20px;
        }
        .horizontal-scroll-container::-webkit-scrollbar-thumb {
            background: linear-gradient(90deg, #ff8800, #ff44aa, #00ccff);
            border-radius: 20px;
        }

        .library-hz-btn {
            flex: 0 0 auto;
            background: linear-gradient(145deg, #22113a, #110722);
            color: #fff;
            padding: 18px 30px;
            border-radius: 60px;
            font-size: 20px;
            font-weight: 700;
            border: 2px solid rgba(255, 255, 255, 0.1);
            min-width: 140px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
            user-select: none;
        }
        /* 🌈 बॉर्डर कलर्स */
        .library-hz-btn:nth-child(6n+1) { border-color: #ff6b6b; box-shadow: 0 0 30px rgba(255, 80, 80, 0.15); }
        .library-hz-btn:nth-child(6n+2) { border-color: #ffb347; box-shadow: 0 0 30px rgba(255, 180, 50, 0.15); }
        .library-hz-btn:nth-child(6n+3) { border-color: #ffd93d; box-shadow: 0 0 30px rgba(255, 220, 60, 0.15); }
        .library-hz-btn:nth-child(6n+4) { border-color: #6bcb77; box-shadow: 0 0 30px rgba(80, 220, 100, 0.15); }
        .library-hz-btn:nth-child(6n+5) { border-color: #4d96ff; box-shadow: 0 0 30px rgba(70, 150, 255, 0.15); }
        .library-hz-btn:nth-child(6n+6) { border-color: #c084fc; box-shadow: 0 0 30px rgba(155, 80, 200, 0.15); }
        
        .library-hz-btn:hover {
            transform: scale(1.03) translateY(-2px);
            box-shadow: 0 12px 40px rgba(255, 200, 0, 0.2);
        }

        /* ✏️ एडिट मोड का स्टाइल */
        .library-hz-btn.editing {
            background: linear-gradient(145deg, #2a1a4a, #1a0a3a);
            border: 2px dashed #ffcc44 !important;
            box-shadow: 0 0 40px rgba(255, 200, 0, 0.3), inset 0 0 20px rgba(255, 200, 0, 0.1);
            cursor: text;
            user-select: text;
            animation: glowEdit 1.2s infinite alternate;
        }
        @keyframes glowEdit {
            0% { box-shadow: 0 0 20px rgba(255, 200, 0, 0.2); }
            100% { box-shadow: 0 0 60px rgba(255, 200, 0, 0.5), 0 0 120px rgba(255, 100, 0, 0.2); }
        }

        /* 🚀 START बटन */
        .click-btn {
            background: linear-gradient(135deg, #ff0055, #ff6600, #ffcc00);
            color: #fff;
            padding: 32px 60px;
            font-size: 38px;
            font-weight: 900;
            border: 4px solid #fff;
            border-radius: 100px;
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.4), 0 0 80px #ff8800;
            box-shadow: 0 0 70px rgba(255, 50, 0, 0.5), 0 0 140px rgba(255, 0, 200, 0.3);
            letter-spacing: 4px;
            animation: glowPulse 1.6s infinite alternate;
            cursor: pointer;
        }
        .click-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 100px #ff6600, 0 0 200px #ff0088, 0 0 300px #ffcc00;
        }
        @keyframes glowPulse {
            0% {
                box-shadow: 0 0 50px rgba(255, 80, 0, 0.5), 0 0 100px rgba(255, 0, 200, 0.2);
                border-color: #fff;
            }
            100% {
                box-shadow: 0 0 100px #ff6600, 0 0 200px #ff0088, 0 0 300px #ffcc00;
                border-color: #ffdd44;
            }
        }

        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #1f0a3a, #030108 80%);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 30px;
            backdrop-filter: blur(6px);
        }

        @media (max-width: 420px) {
            .click-btn { padding: 24px 40px; font-size: 28px; }
            .edit-btn, .save-btn, .add-btn { padding: 10px 18px; font-size: 15px; }
            .library-hz-btn { padding: 14px 20px; font-size: 16px; min-width: 110px; }
            #marketOverlay h2 { font-size: 24px; }
            .controls h4 { font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="mobile-screen">
        <!-- 🏷️ मार्केट बैनर -->
        <div id="marketOverlay">
            <h2>✦ LOCAL MARKET ✦</h2>
            <p>⚡ PRESENT BY AMIR ALI | +91 8797221991 ⚡</p>
        </div>

        <!-- 🌌 यूनिवर्स -->
        <div class="universe-section" id="universeSec">
            <div class="singularity" id="singularityNode"></div>
            <div class="big-bang-flash" id="flashOverlay"></div>
            <div class="cosmos" id="cosmosField">
                <div class="sun"></div>
                <div class="orbit mercury-orbit"><div class="planet mercury"></div></div>
                <div class="orbit venus-orbit"><div class="planet venus"></div></div>
                <div class="orbit earth-orbit"><div class="earth-system"><div class="earth"></div><div class="moon-orbit"><div class="moon"></div></div></div></div>
                <div class="orbit mars-orbit"><div class="planet mars"></div></div>
                <div class="orbit jupiter-orbit"><div class="planet jupiter"></div></div>
                <div class="orbit saturn-orbit"><div class="planet saturn"></div></div>
                <div class="orbit uranus-orbit"><div class="planet uranus"></div></div>
                <div class="orbit neptune-orbit"><div class="planet neptune"></div></div>
            </div>
        </div>

        <!-- 📚 लाइब्रेरी -->
        <div class="library-horizontal-section" id="libraryHzSec">
            <div class="controls">
                <h4>📚 महासंग्रह — चैप्टर एडिट करें</h4>
                <div class="btn-group">
                    <button class="edit-btn" id="editBtn" onclick="toggleEdit()">✏️ Edit</button>
                    <button class="save-btn" id="saveBtn" onclick="saveChapters()">💾 Save</button>
                    <button class="add-btn" onclick="addChapter()">➕ Add</button>
                </div>
            </div>
            <div class="horizontal-scroll-container" id="hzScrollContainer"></div>
        </div>

        <!-- 🚀 START मोडल -->
        <div class="modal-overlay" id="startModal">
            <button class="click-btn" onclick="triggerBigBang()">🚀 START</button>
        </div>
    </div>

    <script>
        const TOTAL_FILES = 59;
        const container = document.getElementById('hzScrollContainer');
        let isEditMode = false;

        // LocalStorage से नाम लोड करें
        let chapterNames = JSON.parse(localStorage.getItem('myChapters')) || Array(TOTAL_FILES).fill(0).map((_, i) => `📖 चैप्टर ${i + 1}`);

        // बटन रेंडर करने का फ़ंक्शन (HTML लिंक्स के साथ)
        function renderButtons() {
            container.innerHTML = '';
            chapterNames.forEach((name, i) => {
                const btn = document.createElement('a');
                btn.className = 'library-hz-btn';
                btn.href = `index${i + 1}.html`; // 🔗 index1.html से index59.html तक का ऑटोमैटिक लिंक
                btn.innerText = name;
                
                // अगर Edit Mode ऑन है तो लिंक रोको और एडिटेबल बनाओ
                if (isEditMode) {
                    btn.classList.add('editing');
                    btn.contentEditable = "true";
                }

                // एडिट मोड में गलती से पेज खुलने से रोकने के लिए
                btn.addEventListener('click', function(e) {
                    if (isEditMode) {
                        e.preventDefault();
                    }
                });

                container.appendChild(btn);
            });
        }
        
        renderButtons();

        // ✏️ Edit Mode टॉगल
        function toggleEdit() {
            isEditMode = !isEditMode;
            const editBtn = document.getElementById('editBtn');
            const saveBtn = document.getElementById('saveBtn');

            if (isEditMode) {
                editBtn.classList.add('active');
                editBtn.textContent = '🔒 Lock';
                saveBtn.classList.add('show');
                alert('✏️ अब आप किसी भी नाम पर क्लिक करके उसे टाइप करके बदल सकते हैं। बदलने के बाद "Save" बटन दबाएँ।');
            } else {
                editBtn.classList.remove('active');
                editBtn.textContent = '✏️ Edit';
                saveBtn.classList.remove('show');
            }
            renderButtons(); // मोड के अनुसार री-रेंडर
        }

        // 💾 Save चैप्टर नाम
        function saveChapters() {
            const btns = document.querySelectorAll('.library-hz-btn');
            const newNames = Array.from(btns).map(b => b.innerText);
            localStorage.setItem('myChapters', JSON.stringify(newNames));
            chapterNames = newNames;
            
            if (isEditMode) {
                isEditMode = false;
                document.getElementById('editBtn').classList.remove('active');
                document.getElementById('editBtn').textContent = '✏️ Edit';
                document.getElementById('saveBtn').classList.remove('show');
            }
            
            alert('✅ सभी चैप्टर के नाम सेव हो गए!');
            renderButtons();
        }

        // ➕ नया चैप्टर जोड़ें
        function addChapter() {
            const newIndex = chapterNames.length + 1;
            const newName = prompt(`नए चैप्टर का नाम लिखें (यह index${newIndex}.html से जुड़ेगा):`, `📖 चैप्टर ${newIndex}`);
            if (newName && newName.trim() !== '') {
                chapterNames.push(newName.trim());
                localStorage.setItem('myChapters', JSON.stringify(chapterNames));
                renderButtons();
            }
        }

        // 🚀 Big Bang और 5 सेकंड बाद बैनर दिखाना
        function triggerBigBang() {
            document.getElementById('startModal').style.display = 'none';

            const singularity = document.getElementById('singularityNode');
            singularity.style.display = 'block';
            singularity.classList.add('singularity-heartbeat');

            setTimeout(() => {
                singularity.style.display = 'none';
                document.getElementById('flashOverlay').classList.add('flash-active');
                document.getElementById('cosmosField').classList.add('visible');

                // बिग बैंग के 5 सेकंड बाद LOCAL MARKET का बैनर आएगा
                setTimeout(() => {
                    document.getElementById('marketOverlay').style.display = 'block';
                }, 5000);

            }, 3200);
        }
    </script>
</body>
</html>
